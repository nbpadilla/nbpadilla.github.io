<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAP BTP Integration Suite Estimator</title>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .lucide-icon { display: inline-block; width: 1em; height: 1em; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState } = React;
        
        // Simple icon components to replace lucide
        const Calculator = () => <span className="lucide-icon">🧮</span>;
        const Download = () => <span className="lucide-icon">⬇️</span>;
        const RefreshCw = () => <span className="lucide-icon">🔄</span>;

        const AcidEstimator = () => {
          const [interfaces, setInterfaces] = useState([{
            id: 1,
            name: '',
            artifacts: { count: 1, complexity: 'medium' },
            connectors: { count: 1, complexity: 'medium' },
            transformations: { count: 1, complexity: 'medium' },
            domain: 'medium'
          }]);

          const complexityFactors = {
            low: 1,
            medium: 1.5,
            high: 2.5,
            veryHigh: 3.5
          };

          const domainFactors = {
            low: 1,
            medium: 1.3,
            high: 1.6,
            veryHigh: 2
          };

          const baseHours = {
            artifact: 4,
            connector: 6,
            transformation: 5
          };

          const addInterface = () => {
            setInterfaces([...interfaces, {
              id: interfaces.length + 1,
              name: '',
              artifacts: { count: 1, complexity: 'medium' },
              connectors: { count: 1, complexity: 'medium' },
              transformations: { count: 1, complexity: 'medium' },
              domain: 'medium'
            }]);
          };

          const removeInterface = (id) => {
            if (interfaces.length > 1) {
              setInterfaces(interfaces.filter(i => i.id !== id));
            }
          };

          const updateInterface = (id, field, value) => {
            setInterfaces(interfaces.map(i => 
              i.id === id ? { ...i, [field]: value } : i
            ));
          };

          const calculateEffort = (iface) => {
            const artifactHours = iface.artifacts.count * baseHours.artifact * 
                                  complexityFactors[iface.artifacts.complexity];
            const connectorHours = iface.connectors.count * baseHours.connector * 
                                   complexityFactors[iface.connectors.complexity];
            const transformHours = iface.transformations.count * baseHours.transformation * 
                                   complexityFactors[iface.transformations.complexity];
            
            const subtotal = artifactHours + connectorHours + transformHours;
            const total = subtotal * domainFactors[iface.domain];
            
            return {
              artifacts: artifactHours,
              connectors: connectorHours,
              transformations: transformHours,
              subtotal,
              total: Math.round(total * 10) / 10
            };
          };

          const getTotalEffort = () => {
            return interfaces.reduce((sum, iface) => {
              return sum + calculateEffort(iface).total;
            }, 0);
          };

          const exportToCSV = () => {
            let csv = 'Interface Name,Artifacts,Artifact Complexity,Connectors,Connector Complexity,Transformations,Transform Complexity,Domain Knowledge,Total Hours\n';
            
            interfaces.forEach(iface => {
              const effort = calculateEffort(iface);
              csv += `"${iface.name || 'Unnamed'}",${iface.artifacts.count},${iface.artifacts.complexity},${iface.connectors.count},${iface.connectors.complexity},${iface.transformations.count},${iface.transformations.complexity},${iface.domain},${effort.total}\n`;
            });
            
            csv += `\nTotal Project Effort,,,,,,,${getTotalEffort().toFixed(1)} hours`;
            
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'sap-btp-estimate.csv';
            a.click();
          };

          const resetAll = () => {
            setInterfaces([{
              id: 1,
              name: '',
              artifacts: { count: 1, complexity: 'medium' },
              connectors: { count: 1, complexity: 'medium' },
              transformations: { count: 1, complexity: 'medium' },
              domain: 'medium'
            }]);
          };

          return (
            <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-6">
              <div className="max-w-7xl mx-auto">
                <div className="bg-white rounded-lg shadow-xl p-8 mb-6">
                  <div className="flex items-center justify-between mb-6">
                    <div className="flex items-center gap-3">
                      <Calculator className="w-8 h-8 text-indigo-600" />
                      <h1 className="text-3xl font-bold text-gray-800">SAP BTP Integration Suite Estimator</h1>
                    </div>
                    <div className="flex gap-2">
                      <button
                        onClick={resetAll}
                        className="flex items-center gap-2 px-4 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 transition"
                      >
                        <RefreshCw className="w-4 h-4" />
                        Reset
                      </button>
                      <button
                        onClick={exportToCSV}
                        className="flex items-center gap-2 px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition"
                      >
                        <Download className="w-4 h-4" />
                        Export CSV
                      </button>
                    </div>
                  </div>
                  
                  <div className="bg-indigo-50 border-l-4 border-indigo-600 p-4 mb-6">
                    <h2 className="font-semibold text-indigo-900 mb-2">AICD Matrix Framework</h2>
                    <p className="text-sm text-indigo-800">
                      <strong>A</strong>rtifacts: iFlows, Value Mappings, Scripts | 
                      <strong>I</strong>ntegration: Data Mapping, Transformation Logic | 
                      <strong>C</strong>onnectors: Adapters, APIs, Authentication | 
                      <strong>D</strong>omain: Business Process Knowledge
                    </p>
                  </div>

                  {interfaces.map((iface, idx) => {
                    const effort = calculateEffort(iface);
                    
                    return (
                      <div key={iface.id} className="bg-gray-50 rounded-lg p-6 mb-4 border-2 border-gray-200">
                        <div className="flex justify-between items-center mb-4">
                          <h3 className="text-xl font-semibold text-gray-700">Interface #{idx + 1}</h3>
                          {interfaces.length > 1 && (
                            <button
                              onClick={() => removeInterface(iface.id)}
                              className="text-red-600 hover:text-red-800 font-medium"
                            >
                              Remove
                            </button>
                          )}
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                          <div className="col-span-2">
                            <label className="block text-sm font-medium text-gray-700 mb-2">
                              Interface Name
                            </label>
                            <input
                              type="text"
                              value={iface.name}
                              onChange={(e) => updateInterface(iface.id, 'name', e.target.value)}
                              placeholder="e.g., S/4HANA to Salesforce Order Sync"
                              className="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                            />
                          </div>

                          <div>
                            <label className="block text-sm font-medium text-gray-700 mb-2">
                              Artifacts (iFlows, Value Maps)
                            </label>
                            <div className="flex gap-2">
                              <input
                                type="number"
                                min="1"
                                value={iface.artifacts.count}
                                onChange={(e) => updateInterface(iface.id, 'artifacts', { ...iface.artifacts, count: parseInt(e.target.value) || 1 })}
                                className="w-20 px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500"
                              />
                              <select
                                value={iface.artifacts.complexity}
                                onChange={(e) => updateInterface(iface.id, 'artifacts', { ...iface.artifacts, complexity: e.target.value })}
                                className="flex-1 px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500"
                              >
                                <option value="low">Low - Simple iFlow</option>
                                <option value="medium">Medium - Standard iFlow</option>
                                <option value="high">High - Complex routing</option>
                                <option value="veryHigh">Very High - Multi-step orchestration</option>
                              </select>
                            </div>
                          </div>

                          <div>
                            <label className="block text-sm font-medium text-gray-700 mb-2">
                              Connectors/Integration (Adapters)
                            </label>
                            <div className="flex gap-2">
                              <input
                                type="number"
                                min="1"
                                value={iface.connectors.count}
                                onChange={(e) => updateInterface(iface.id, 'connectors', { ...iface.connectors, count: parseInt(e.target.value) || 1 })}
                                className="w-20 px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500"
                              />
                              <select
                                value={iface.connectors.complexity}
                                onChange={(e) => updateInterface(iface.id, 'connectors', { ...iface.connectors, complexity: e.target.value })}
                                className="flex-1 px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500"
                              >
                                <option value="low">Low - SOAP/REST basic</option>
                                <option value="medium">Medium - OAuth, certificates</option>
                                <option value="high">High - Custom adapters</option>
                                <option value="veryHigh">Very High - Legacy systems</option>
                              </select>
                            </div>
                          </div>

                          <div>
                            <label className="block text-sm font-medium text-gray-700 mb-2">
                              Transformations (Mapping, Scripts)
                            </label>
                            <div className="flex gap-2">
                              <input
                                type="number"
                                min="1"
                                value={iface.transformations.count}
                                onChange={(e) => updateInterface(iface.id, 'transformations', { ...iface.transformations, count: parseInt(e.target.value) || 1 })}
                                className="w-20 px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500"
                              />
                              <select
                                value={iface.transformations.complexity}
                                onChange={(e) => updateInterface(iface.id, 'transformations', { ...iface.transformations, complexity: e.target.value })}
                                className="flex-1 px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500"
                              >
                                <option value="low">Low - Direct mapping</option>
                                <option value="medium">Medium - Groovy scripts</option>
                                <option value="high">High - Complex logic</option>
                                <option value="veryHigh">Very High - Multi-format conversion</option>
                              </select>
                            </div>
                          </div>

                          <div>
                            <label className="block text-sm font-medium text-gray-700 mb-2">
                              Domain Knowledge Required
                            </label>
                            <select
                              value={iface.domain}
                              onChange={(e) => updateInterface(iface.id, 'domain', e.target.value)}
                              className="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500"
                            >
                              <option value="low">Low - Generic patterns</option>
                              <option value="medium">Medium - Standard business process</option>
                              <option value="high">High - Industry-specific</option>
                              <option value="veryHigh">Very High - Regulatory/compliance</option>
                            </select>
                          </div>
                        </div>

                        <div className="bg-white rounded-lg p-4 border-2 border-indigo-200">
                          <div className="grid grid-cols-2 md:grid-cols-5 gap-4 text-center">
                            <div>
                              <div className="text-xs text-gray-600 mb-1">Artifacts</div>
                              <div className="text-lg font-semibold text-indigo-600">{effort.artifacts.toFixed(1)}h</div>
                            </div>
                            <div>
                              <div className="text-xs text-gray-600 mb-1">Connectors</div>
                              <div className="text-lg font-semibold text-indigo-600">{effort.connectors.toFixed(1)}h</div>
                            </div>
                            <div>
                              <div className="text-xs text-gray-600 mb-1">Transforms</div>
                              <div className="text-lg font-semibold text-indigo-600">{effort.transformations.toFixed(1)}h</div>
                            </div>
                            <div>
                              <div className="text-xs text-gray-600 mb-1">Subtotal</div>
                              <div className="text-lg font-semibold text-gray-700">{effort.subtotal.toFixed(1)}h</div>
                            </div>
                            <div className="bg-indigo-50 rounded p-2">
                              <div className="text-xs text-gray-600 mb-1">Total Effort</div>
                              <div className="text-xl font-bold text-indigo-700">{effort.total}h</div>
                            </div>
                          </div>
                        </div>
                      </div>
                    );
                  })}

                  <button
                    onClick={addInterface}
                    className="w-full py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition font-medium mb-6"
                  >
                    + Add Another Interface
                  </button>

                  <div className="bg-gradient-to-r from-indigo-600 to-blue-600 rounded-lg p-6 text-white">
                    <div className="flex justify-between items-center">
                      <div>
                        <h2 className="text-2xl font-bold mb-1">Total Project Effort</h2>
                        <p className="text-indigo-100">Based on {interfaces.length} interface{interfaces.length !== 1 ? 's' : ''}</p>
                      </div>
                      <div className="text-right">
                        <div className="text-5xl font-bold">{getTotalEffort().toFixed(1)}</div>
                        <div className="text-xl text-indigo-100">hours</div>
                        <div className="text-sm text-indigo-200 mt-2">
                          ≈ {(getTotalEffort() / 8).toFixed(1)} days
                        </div>
                      </div>
                    </div>
                  </div>

                  <div className="mt-6 bg-yellow-50 border-l-4 border-yellow-400 p-4">
                    <p className="text-sm text-yellow-800">
                      <strong>Note:</strong> These estimates are for development only. Add 20-30% for testing, 10-15% for documentation, and buffer for reviews and rework.
                    </p>
                  </div>
                </div>
              </div>
            </div>
          );
        };

        ReactDOM.render(<AcidEstimator />, document.getElementById('root'));
    </script>
</body>
</html>
