<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAP Password Decoder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px; /* Slightly narrower than the beautifier for a single column focus */
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 0.95em;
        }

        .section {
            margin-bottom: 25px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            height: 36px;
        }

        .section-title {
            font-weight: 600;
            color: #333;
            font-size: 1.1em;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: #e2e8f0;
            color: #4a5568;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.2em;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .icon-btn:hover {
            background: #cbd5e0;
            transform: translateY(-1px);
        }

        .icon-btn:active {
            transform: translateY(0);
        }

        .icon-btn.copied {
            background: #48bb78;
            color: white;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            background: #f8fafc;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            background: #fff;
        }

        textarea {
            resize: vertical;
            height: 100px;
        }

        .action-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-bottom: 25px;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4);
        }

        .action-btn:active {
            transform: translateY(0);
        }

        /* Success Glow Animation */
        @keyframes successGlow {
            0% {
                border-color: #48bb78;
                box-shadow: 0 0 0 4px rgba(72, 187, 120, 0.2);
            }
            100% {
                border-color: #e2e8f0;
                box-shadow: none;
            }
        }

        @keyframes errorShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .glow-success {
            animation: successGlow 1.5s ease-out forwards;
        }

        .shake-error {
            animation: errorShake 0.4s ease-in-out;
            border-color: #c53030 !important;
        }

        .error-message {
            background: #fed7d7;
            color: #c53030;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 0.9em;
            text-align: center;
        }

        .status-message {
            margin-top: 10px;
            font-size: 0.9em;
            color: #666;
            text-align: right;
            min-height: 20px;
        }

        .status-success { color: #48bb78; }
        .status-error { color: #c53030; }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 SAP Password Decoder</h1>
        <p class="subtitle">Replicating Java's Base64 + XOR logic (Key: 0x74, Reversed).</p>
        
        <div class="error-message" id="globalError"></div>

        <!-- Input Section -->
        <div class="section">
            <div class="section-header">
                <span class="section-title">Base64 Encoded Password</span>
                <button class="icon-btn" onclick="clearInput()" title="Clear Input">🗑️</button>
            </div>
            <input type="text" id="encodedInput" placeholder="Enter Base64 String here..." autocomplete="off">
        </div>

        <!-- Action Button -->
        <button class="action-btn" onclick="decodePasswordAndDisplay()">Decode Password</button>

        <!-- Output Section -->
        <div class="section">
            <div class="section-header">
                <span class="section-title">Decoded Result</span>
                <div class="header-actions">
                    <button class="icon-btn" onclick="copyToClipboard()" title="Copy" id="copyBtn">📋</button>
                </div>
            </div>
            <textarea id="output" placeholder="Result will appear here..." readonly></textarea>
            <div id="statusMessage" class="status-message"></div>
        </div>
    </div>

    <script>
        const XOR_KEY = 0x74; // Decimal 116

        /**
         * Replicates the exact Java getPassword logic: Base64 decode,
         * check prefix (byte 1), XOR with 0x74, and reverse the result.
         */
        function decodePassword(b64String) {
            try {
                // 1. Base64 Decode to binary string
                const binaryString = atob(b64String);

                // 2. String to Uint8Array
                const len = binaryString.length;
                if (len === 0) {
                    return { success: false, message: "Input is empty." };
                }

                const aByteArray = new Uint8Array(len);
                for (let i = 0; i < len; i++) {
                    aByteArray[i] = binaryString.charCodeAt(i);
                }

                // Check prefix
                if (aByteArray[0] !== 1) {
                    return { success: false, message: "Invalid format: First byte must be 1." };
                }

                const resultLen = len - 1;
                const result = new Uint8Array(resultLen);

                // Decryption and Reverse Order
                for (let i = 1; i < len; i++) {
                    const encryptedByte = aByteArray[i];
                    const decryptedByte = encryptedByte ^ XOR_KEY;
                    const resultIndex = resultLen - i;
                    result[resultIndex] = decryptedByte;
                }
                
                // 3. Bytes to String
                const decodedString = new TextDecoder().decode(result);
                return { success: true, message: decodedString };

            } catch (e) {
                return { success: false, message: "Invalid Base64 string." };
            }
        }

        function decodePasswordAndDisplay() {
            const inputField = document.getElementById('encodedInput');
            const outputField = document.getElementById('output');
            const statusDiv = document.getElementById('statusMessage');
            const globalError = document.getElementById('globalError');

            // Reset UI
            outputField.classList.remove('glow-success', 'shake-error');
            globalError.style.display = 'none';
            statusDiv.textContent = '';
            
            const b64String = inputField.value.trim();

            if (!b64String) {
                // If empty, just focus input and maybe shake slightly to indicate requirement
                inputField.focus();
                globalError.textContent = "Please enter a password to decode.";
                globalError.style.display = 'block';
                return;
            }

            const result = decodePassword(b64String);

            if (result.success) {
                outputField.value = result.message;
                triggerSuccessGlow(outputField);
                statusDiv.textContent = `Successfully decoded ${result.message.length} characters.`;
                statusDiv.className = 'status-message status-success';
            } else {
                outputField.value = "DECODING FAILED";
                outputField.classList.add('shake-error');
                globalError.textContent = result.message;
                globalError.style.display = 'block';
                statusDiv.textContent = 'Decoding failed.';
                statusDiv.className = 'status-message status-error';
            }
        }

        function triggerSuccessGlow(element) {
            element.classList.remove('glow-success');
            void element.offsetWidth; // Trigger reflow
            element.classList.add('glow-success');
        }

        function copyToClipboard() {
            const outputField = document.getElementById('output');
            if (!outputField.value || outputField.value === "DECODING FAILED") return;

            outputField.select();
            document.execCommand('copy');

            const copyBtn = document.getElementById('copyBtn');
            
            copyBtn.classList.add('copied');
            copyBtn.textContent = '✓';

            const statusDiv = document.getElementById('statusMessage');
            const originalStatus = statusDiv.textContent;
            statusDiv.textContent = "Copied to clipboard!";

            setTimeout(() => {
                copyBtn.classList.remove('copied');
                copyBtn.textContent = '📋';
                statusDiv.textContent = originalStatus;
            }, 2000);
        }

        function clearInput() {
            document.getElementById('encodedInput').value = '';
            document.getElementById('output').value = '';
            document.getElementById('statusMessage').textContent = '';
            document.getElementById('globalError').style.display = 'none';
            document.getElementById('output').classList.remove('glow-success', 'shake-error');
        }

        // Allow pressing Enter to decode
        document.getElementById('encodedInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                decodePasswordAndDisplay();
            }
        });
    </script>
</body>
</html>
