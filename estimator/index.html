<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAP BTP Integration Suite Estimator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; padding: 0; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import React, { useState } from 'https://esm.sh/react@18.2.0';
        import ReactDOM from 'https://esm.sh/react-dom@18.2.0';
        import { Calculator, Download, RefreshCw } from 'https://esm.sh/lucide-react@0.263.1';

        const AcidEstimator = () => {
          const [interfaces, setInterfaces] = useState([{
            id: 1,
            name: '',
            artifacts: { count: 1, complexity: 'medium' },
            connectors: { count: 1, complexity: 'medium' },
            transformations: { count: 1, complexity: 'medium' },
            domain: 'medium'
          }]);

          const complexityFactors = {
            low: 1,
            medium: 1.5,
            high: 2.5,
            veryHigh: 3.5
          };

          const domainFactors = {
            low: 1,
            medium: 1.3,
            high: 1.6,
            veryHigh: 2
          };

          const baseHours = {
            artifact: 4,
            connector: 6,
            transformation: 5
          };

          const addInterface = () => {
            setInterfaces([...interfaces, {
              id: interfaces.length + 1,
              name: '',
              artifacts: { count: 1, complexity: 'medium' },
              connectors: { count: 1, complexity: 'medium' },
              transformations: { count: 1, complexity: 'medium' },
              domain: 'medium'
            }]);
          };

          const removeInterface = (id) => {
            if (interfaces.length > 1) {
              setInterfaces(interfaces.filter(i => i.id !== id));
            }
          };

          const updateInterface = (id, field, value) => {
            setInterfaces(interfaces.map(i => 
              i.id === id ? { ...i, [field]: value } : i
            ));
          };

          const calculateEffort = (iface) => {
            const artifactHours = iface.artifacts.count * baseHours.artifact * 
                                  complexityFactors[iface.artifacts.complexity];
            const connectorHours = iface.connectors.count * baseHours.connector * 
                                   complexityFactors[iface.connectors.complexity];
            const transformHours = iface.transformations.count * baseHours.transformation * 
                                   complexityFactors[iface.transformations.complexity];
            
            const subtotal = artifactHours + connectorHours + transformHours;
            const total = subtotal * domainFactors[iface.domain];
            
            return {
              artifacts: artifactHours,
              connectors: connectorHours,
              transformations: transformHours,
              subtotal,
              total: Math.round(total * 10) / 10
            };
          };

          const getTotalEffort = () => {
            return interfaces.reduce((sum, iface) => {
              return sum + calculateEffort(iface).total;
            }, 0);
          };

          const exportToCSV = () => {
            let csv = 'Interface Name,Artifacts,Artifact Complexity,Connectors,Connector Complexity,Transformations,Transform Complexity,Domain Knowledge,Total Hours\n';
            
            interfaces.forEach(iface => {
              const effort = calculateEffort(iface);
              csv += `"${iface.name || 'Unnamed'}",${iface.artifacts.count},${iface.artifacts.complexity},${iface.connectors.count},${iface.connectors.complexity},${iface.transformations.count},${iface.transformations.complexity},${iface.domain},${effort.total}\n`;
            });
            
            csv += `\nTotal Project Effort,,,,,,,${getTotalEffort().toFixed(1)} hours`;
            
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'sap-btp-estimate.csv';
            a.click();
          };

          const resetAll = () => {
            setInterfaces([{
              id: 1,
              name: '',
              artifacts: { count: 1, complexity: 'medium' },
              connectors: { count: 1, complexity: 'medium' },
              transformations: { count: 1, complexity: 'medium' },
              domain: 'medium'
            }]);
          };

          return React.createElement('div', { className: "min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-6" },
            React.createElement('div', { className: "max-w-7xl mx-auto" },
              React.createElement('div', { className: "bg-white rounded-lg shadow-xl p-8 mb-6" },
                React.createElement('div', { className: "flex items-center justify-between mb-6" },
                  React.createElement('div', { className: "flex items-center gap-3" },
                    React.createElement(Calculator, { className: "w-8 h-8 text-indigo-600" }),
                    React.createElement('h1', { className: "text-3xl font-bold text-gray-800" }, 'SAP BTP Integration Suite Estimator')
                  ),
                  React.createElement('div', { className: "flex gap-2" },
                    React.createElement('button', {
                      onClick: resetAll,
                      className: "flex items-center gap-2 px-4 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 transition"
                    },
                      React.createElement(RefreshCw, { className: "w-4 h-4" }),
                      'Reset'
                    ),
                    React.createElement('button', {
                      onClick: exportToCSV,
                      className: "flex items-center gap-2 px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition"
                    },
                      React.createElement(Download, { className: "w-4 h-4" }),
                      'Export CSV'
                    )
                  )
                ),
                
                React.createElement('div', { className: "bg-indigo-50 border-l-4 border-indigo-600 p-4 mb-6" },
                  React.createElement('h2', { className: "font-semibold text-indigo-900 mb-2" }, 'ACID Matrix Framework'),
                  React.createElement('p', { className: "text-sm text-indigo-800" },
                    React.createElement('strong', null, 'A'), 'rtifacts: iFlows, Value Mappings, Scripts | ',
                    React.createElement('strong', null, 'I'), 'ntegration: Data Mapping, Transformation Logic | ',
					React.createElement('strong', null, 'C'), 'onnectors: Adapters, APIs, Authentication | ',
                    React.createElement('strong', null, 'D'), 'omain: Business Process Knowledge'
                  )
                ),

                interfaces.map((iface, idx) => {
                  const effort = calculateEffort(iface);
                  
                  return React.createElement('div', {
                    key: iface.id,
                    className: "bg-gray-50 rounded-lg p-6 mb-4 border-2 border-gray-200"
                  },
                    React.createElement('div', { className: "flex justify-between items-center mb-4" },
                      React.createElement('h3', { className: "text-xl font-semibold text-gray-700" }, `Interface #${idx + 1}`),
                      interfaces.length > 1 && React.createElement('button', {
                        onClick: () => removeInterface(iface.id),
                        className: "text-red-600 hover:text-red-800 font-medium"
                      }, 'Remove')
                    ),

                    React.createElement('div', { className: "grid grid-cols-1 md:grid-cols-2 gap-4 mb-4" },
                      React.createElement('div', { className: "col-span-2" },
                        React.createElement('label', { className: "block text-sm font-medium text-gray-700 mb-2" }, 'Interface Name'),
                        React.createElement('input', {
                          type: "text",
                          value: iface.name,
                          onChange: (e) => updateInterface(iface.id, 'name', e.target.value),
                          placeholder: "e.g., S/4HANA to Salesforce Order Sync",
                          className: "w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                        })
                      ),

                      React.createElement('div', null,
                        React.createElement('label', { className: "block text-sm font-medium text-gray-700 mb-2" }, 'Artifacts (iFlows, Value Maps)'),
                        React.createElement('div', { className: "flex gap-2" },
                          React.createElement('input', {
                            type: "number",
                            min: "1",
                            value: iface.artifacts.count,
                            onChange: (e) => updateInterface(iface.id, 'artifacts', { ...iface.artifacts, count: parseInt(e.target.value) || 1 }),
                            className: "w-20 px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500"
                          }),
                          React.createElement('select', {
                            value: iface.artifacts.complexity,
                            onChange: (e) => updateInterface(iface.id, 'artifacts', { ...iface.artifacts, complexity: e.target.value }),
                            className: "flex-1 px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500"
                          },
                            React.createElement('option', { value: "low" }, 'Low - Simple iFlow'),
                            React.createElement('option', { value: "medium" }, 'Medium - Standard iFlow'),
                            React.createElement('option', { value: "high" }, 'High - Complex routing'),
                            React.createElement('option', { value: "veryHigh" }, 'Very High - Multi-step orchestration')
                          )
                        )
                      ),

                      React.createElement('div', null,
                        React.createElement('label', { className: "block text-sm font-medium text-gray-700 mb-2" }, 'Connectors/Integration (Adapters)'),
                        React.createElement('div', { className: "flex gap-2" },
                          React.createElement('input', {
                            type: "number",
                            min: "1",
                            value: iface.connectors.count,
                            onChange: (e) => updateInterface(iface.id, 'connectors', { ...iface.connectors, count: parseInt(e.target.value) || 1 }),
                            className: "w-20 px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500"
                          }),
                          React.createElement('select', {
                            value: iface.connectors.complexity,
                            onChange: (e) => updateInterface(iface.id, 'connectors', { ...iface.connectors, complexity: e.target.value }),
                            className: "flex-1 px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500"
                          },
                            React.createElement('option', { value: "low" }, 'Low - SOAP/REST basic'),
                            React.createElement('option', { value: "medium" }, 'Medium - OAuth, certificates'),
                            React.createElement('option', { value: "high" }, 'High - Custom adapters'),
                            React.createElement('option', { value: "veryHigh" }, 'Very High - Legacy systems')
                          )
                        )
                      ),

                      React.createElement('div', null,
                        React.createElement('label', { className: "block text-sm font-medium text-gray-700 mb-2" }, 'Transformations (Mapping, Scripts)'),
                        React.createElement('div', { className: "flex gap-2" },
                          React.createElement('input', {
                            type: "number",
                            min: "1",
                            value: iface.transformations.count,
                            onChange: (e) => updateInterface(iface.id, 'transformations', { ...iface.transformations, count: parseInt(e.target.value) || 1 }),
                            className: "w-20 px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500"
                          }),
                          React.createElement('select', {
                            value: iface.transformations.complexity,
                            onChange: (e) => updateInterface(iface.id, 'transformations', { ...iface.transformations, complexity: e.target.value }),
                            className: "flex-1 px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500"
                          },
                            React.createElement('option', { value: "low" }, 'Low - Direct mapping'),
                            React.createElement('option', { value: "medium" }, 'Medium - Groovy scripts'),
                            React.createElement('option', { value: "high" }, 'High - Complex logic'),
                            React.createElement('option', { value: "veryHigh" }, 'Very High - Multi-format conversion')
                          )
                        )
                      ),

                      React.createElement('div', null,
                        React.createElement('label', { className: "block text-sm font-medium text-gray-700 mb-2" }, 'Domain Knowledge Required'),
                        React.createElement('select', {
                          value: iface.domain,
                          onChange: (e) => updateInterface(iface.id, 'domain', e.target.value),
                          className: "w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500"
                        },
                          React.createElement('option', { value: "low" }, 'Low - Generic patterns'),
                          React.createElement('option', { value: "medium" }, 'Medium - Standard business process'),
                          React.createElement('option', { value: "high" }, 'High - Industry-specific'),
                          React.createElement('option', { value: "veryHigh" }, 'Very High - Regulatory/compliance')
                        )
                      )
                    ),

                    React.createElement('div', { className: "bg-white rounded-lg p-4 border-2 border-indigo-200" },
                      React.createElement('div', { className: "grid grid-cols-2 md:grid-cols-5 gap-4 text-center" },
                        React.createElement('div', null,
                          React.createElement('div', { className: "text-xs text-gray-600 mb-1" }, 'Artifacts'),
                          React.createElement('div', { className: "text-lg font-semibold text-indigo-600" }, `${effort.artifacts.toFixed(1)}h`)
                        ),
                        React.createElement('div', null,
                          React.createElement('div', { className: "text-xs text-gray-600 mb-1" }, 'Connectors'),
                          React.createElement('div', { className: "text-lg font-semibold text-indigo-600" }, `${effort.connectors.toFixed(1)}h`)
                        ),
                        React.createElement('div', null,
                          React.createElement('div', { className: "text-xs text-gray-600 mb-1" }, 'Transforms'),
                          React.createElement('div', { className: "text-lg font-semibold text-indigo-600" }, `${effort.transformations.toFixed(1)}h`)
                        ),
                        React.createElement('div', null,
                          React.createElement('div', { className: "text-xs text-gray-600 mb-1" }, 'Subtotal'),
                          React.createElement('div', { className: "text-lg font-semibold text-gray-700" }, `${effort.subtotal.toFixed(1)}h`)
                        ),
                        React.createElement('div', { className: "bg-indigo-50 rounded p-2" },
                          React.createElement('div', { className: "text-xs text-gray-600 mb-1" }, 'Total Effort'),
                          React.createElement('div', { className: "text-xl font-bold text-indigo-700" }, `${effort.total}h`)
                        )
                      )
                    )
                  );
                }),

                React.createElement('button', {
                  onClick: addInterface,
                  className: "w-full py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition font-medium mb-6"
                }, '+ Add Another Interface'),

                React.createElement('div', { className: "bg-gradient-to-r from-indigo-600 to-blue-600 rounded-lg p-6 text-white" },
                  React.createElement('div', { className: "flex justify-between items-center" },
                    React.createElement('div', null,
                      React.createElement('h2', { className: "text-2xl font-bold mb-1" }, 'Total Project Effort'),
                      React.createElement('p', { className: "text-indigo-100" }, `Based on ${interfaces.length} interface${interfaces.length !== 1 ? 's' : ''}`)
                    ),
                    React.createElement('div', { className: "text-right" },
                      React.createElement('div', { className: "text-5xl font-bold" }, getTotalEffort().toFixed(1)),
                      React.createElement('div', { className: "text-xl text-indigo-100" }, 'hours'),
                      React.createElement('div', { className: "text-sm text-indigo-200 mt-2" }, `≈ ${(getTotalEffort() / 8).toFixed(1)} days`)
                    )
                  )
                ),

                React.createElement('div', { className: "mt-6 bg-yellow-50 border-l-4 border-yellow-400 p-4" },
                  React.createElement('p', { className: "text-sm text-yellow-800" },
                    React.createElement('strong', null, 'Note:'),
                    ' These estimates are for development only. Add 20-30% for testing, 10-15% for documentation, and buffer for reviews and rework.'
                  )
                )
              )
            )
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(AcidEstimator));
    </script>
</body>
</html>
