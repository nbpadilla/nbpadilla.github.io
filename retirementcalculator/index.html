<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retirement Plan Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-6 flex flex-col">

    <!-- Back Button -->
    <div class="max-w-4xl mx-auto w-full mb-4">
        <button onclick="window.history.back()" class="flex items-center text-indigo-600 hover:text-indigo-800 transition duration-150 p-2 rounded-lg hover:bg-white/50">
            <!-- Icon for Back/Home -->
            <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
            </svg>
            <span class="font-medium">Back</span>
        </button>
    </div>

    <div class="max-w-4xl mx-auto w-full flex-grow">
        <div class="bg-white rounded-lg shadow-xl p-8">
            <div class="flex items-center gap-3 mb-6">
                <svg class="w-8 h-8 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <rect x="4" y="2" width="16" height="20" rx="2" stroke-width="2"/>
                    <line x1="8" y1="6" x2="16" y2="6" stroke-width="2"/>
                    <line x1="8" y1="10" x2="16" y2="10" stroke-width="2"/>
                    <line x1="8" y1="14" x2="16" y2="14" stroke-width="2"/>
                    <line x1="8" y1="18" x2="12" y2="18" stroke-width="2"/>
                </svg>
                <h1 class="text-3xl font-bold text-gray-800">Retirement Plan Calculator</h1>
            </div>

            <div class="bg-indigo-50 rounded-lg p-6 mb-8">
                <h2 class="text-lg font-semibold text-indigo-900 mb-3">Percentage Payable by Years of Service</h2>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-sm" id="percentageTable"></div>
            </div>

            <form id="calculatorForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Age (years)
                    </label>
                    <input
                        type="number"
                        id="age"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                        placeholder="Enter age"
                        min="0"
                        required
                    />
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Basic Salary (₱)
                    </label>
                    <input
                        type="number"
                        id="basicSalary"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                        placeholder="Enter basic salary"
                        min="0"
                        step="0.01"
                        required
                    />
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Years of Credited Service
                    </label>
                    <input
                        type="number"
                        id="yearsOfService"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                        placeholder="Enter years of service"
                        min="0"
                        required
                    />
                </div>

                <button
                    type="submit"
                    class="w-full bg-indigo-600 text-white font-semibold py-3 px-6 rounded-lg hover:bg-indigo-700 transition duration-200"
                >
                    Calculate Retirement Benefit
                </button>
            </form>

            <div id="result" class="mt-8 hidden"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="mt-8 py-4 text-center text-sm text-gray-600 w-full">
        <p class="max-w-4xl mx-auto border-t pt-4 border-gray-200">
            <span class="font-semibold text-gray-700">Privacy Notice:</span> No data is saved or stored. This calculator is entirely client-side and free to use.
        </p>
    </footer>

    <script>
        const servicePercentages = {
            5: 25, 6: 30, 7: 35, 8: 40, 9: 45, 10: 50,
            11: 55, 12: 60, 13: 65, 14: 70, 15: 75,
            16: 80, 17: 85, 18: 90, 19: 95, 20: 100
        };

        // Populate percentage table
        const table = document.getElementById('percentageTable');
        Object.entries(servicePercentages).forEach(([years, percent]) => {
            const div = document.createElement('div');
            div.className = 'bg-white rounded px-3 py-2';
            div.innerHTML = `
                <span class="font-medium text-gray-700">${years} years:</span>
                <span class="ml-2 text-indigo-600 font-semibold">${percent}%</span>
            `;
            table.appendChild(div);
        });

        function getPercentage(years) {
            const yearNum = parseInt(years);
            if (yearNum < 5) return 0;
            if (yearNum >= 20) return 100;
            return servicePercentages[yearNum] || 0;
        }

        function formatCurrency(amount) {
            return new Intl.NumberFormat('en-PH', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }).format(amount);
        }

        document.getElementById('calculatorForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const age = parseInt(document.getElementById('age').value);
            const basicSalary = parseFloat(document.getElementById('basicSalary').value);
            const yearsOfService = parseInt(document.getElementById('yearsOfService').value);
            
            const resultDiv = document.getElementById('result');
            resultDiv.classList.remove('hidden');

            if (yearsOfService < 5) {
                resultDiv.className = 'mt-8 bg-gradient-to-r from-orange-50 to-yellow-50 rounded-lg p-6 border-2 border-orange-200';
                resultDiv.innerHTML = `
                    <p class="text-orange-700 font-medium">Minimum 5 years of service required for retirement benefits</p>
                `;
                return;
            }

            const percentage = getPercentage(yearsOfService);
            const amount = basicSalary * yearsOfService * (percentage / 100);

            resultDiv.className = 'mt-8 bg-gradient-to-r from-green-50 to-emerald-50 rounded-lg p-6 border-2 border-green-200';
            resultDiv.innerHTML = `
                <div>
                    <h3 class="text-xl font-bold text-gray-800 mb-4">Calculation Result</h3>
                    
                    <div class="space-y-3 mb-4">
                        <div class="flex justify-between items-center">
                            <span class="text-gray-600">Age:</span>
                            <span class="font-semibold text-gray-800">${age} years</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-gray-600">Basic Salary:</span>
                            <span class="font-semibold text-gray-800">₱${formatCurrency(basicSalary)}</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-gray-600">Years of Service:</span>
                            <span class="font-semibold text-gray-800">${yearsOfService} years</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-gray-600">Percentage Payable:</span>
                            <span class="font-semibold text-indigo-600">${percentage}%</span>
                        </div>
                    </div>

                    <div class="border-t-2 border-green-300 pt-4">
                        <div class="bg-white rounded-lg p-4">
                            <p class="text-sm text-gray-600 mb-2">Formula: ₱${formatCurrency(basicSalary)} × ${yearsOfService} × ${percentage}%</p>
                            <div class="flex justify-between items-center">
                                <span class="text-lg font-semibold text-gray-800">Retirement Benefit:</span>
                                <span class="text-2xl font-bold text-green-600">₱${formatCurrency(amount)}</span>
                            </div>
                        </div>
                    </div>

                    <p class="text-sm text-gray-600 mt-4 italic">
                        *₱${formatCurrency(amount)} Pesos shall be taxable on individual employee's tax bracket
                    </p>
                </div>
            `;
        });
    </script>
</body>
</html>
